<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#704a32">
  <title>Coffee Dial</title>
  <link rel="stylesheet" href="web.css">
  <script>
    try {
      var mode = localStorage.getItem("coffee_theme");
      var systemDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
      var dark = mode === "DARK" || (mode !== "LIGHT" && systemDark);
      if (dark) {
        var root = document.documentElement;
        root.style.setProperty("--page-bg", "#1c1612");
        root.style.setProperty("--page-fg", "#f6efe6");
        root.style.setProperty("--notice-bg", "#3a2c22");
        root.style.setProperty("color-scheme", "dark");
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute("content", "#1c1612");
      }
    } catch (e) {}
  </script>
</head>
<body>
  <header id="web-notice" class="notice" style="display:none">Datos guardados en este navegador. Logueate o usa el Backup para pasarlos al teléfono o conservar una copia.</header>
  <p id="loading" role="status">Cargando Coffee Dial…</p>
  <main id="app" aria-label="Coffee Dial"></main>
  <noscript>Activá JavaScript para usar Coffee Dial.</noscript>
  <script>
    try {
      var stored = localStorage.getItem("coffee_language");
      var nav = (navigator.language || "").toLowerCase();
      var english = stored === "ENGLISH" ||
        (stored !== "SPANISH" && nav.indexOf("en") === 0);
      if (english) {
        document.documentElement.lang = "en";
        var notice = document.getElementById("web-notice");
        if (notice) {
          notice.textContent = "Data stays in this browser. Sign in or use Backup to move it to your phone or keep a copy.";
        }
        var loading = document.getElementById("loading");
        if (loading) loading.textContent = "Loading Coffee Dial…";
        var noscript = document.querySelector("noscript");
        if (noscript) noscript.textContent = "Enable JavaScript to use Coffee Dial.";
      }
    } catch (e) {}
  </script>
  <script src="browser.js"></script>
  <script src="auth.js"></script>
  <script src="shared.js"></script>
</body>
</html>
